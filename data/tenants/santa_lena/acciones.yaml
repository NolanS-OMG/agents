acciones:
  - categoria: pedido_domicilio
    nombre: Pedir a domicilio
    campos_requeridos:
      - nombre_cliente
      - telefono
      - direccion_entrega
      - items_pedido
    campos_opcionales:
      - notas_especiales
      - metodo_pago
    confirmacion_requerida: true

  - categoria: pedido_recoger
    nombre: Pedir para recoger en restaurante
    campos_requeridos:
      - nombre_cliente
      - telefono
      - items_pedido
    campos_opcionales:
      - hora_recoger
      - notas_especiales
    confirmacion_requerida: true

  - categoria: reservacion
    nombre: Hacer reservación
    campos_requeridos:
      - nombre_cliente
      - telefono
      - fecha
      - hora
      - numero_personas
    campos_opcionales:
      - ocasion_especial
      - preferencia_zona
      - notas_especiales
    confirmacion_requerida: true
